# Vector type definitions
vector_types:
  uart:
    name: "UART Serial Header"
    description: "Access via UART pins on mainboard, inject keys via shell"
    persistent: true
    requires_opening: true
  dustbin:
    name: "Dustbin Sensor Short"
    description: "Short dustbin sensor pins during boot to drop to shell"
    persistent: true
    requires_opening: true
  ota_downgrade:
    name: "OTA Firmware Downgrade"
    description: "Flash older vulnerable firmware via MiIO OTA"
    persistent: false
    requires_opening: false
  su_binary:
    name: "Pre-rooted Firmware (su binary)"
    description: "Flash firmware with su binary and dropbear pre-installed"
    persistent: true
    requires_opening: false