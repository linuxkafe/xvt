# XVT Device Fingerprint Database
# Sources: valetudo.cloud, builder.dontvacuum.me, robotinfo.dev
# Format: model -> firmware range -> exploit vectors

fingerprints:
  # Xiaomi Mi Robot Vacuum (1st gen)
  - model: "rockrobo.vacuum.s5"
    name: "Mi Robot Vacuum (S5)"
    vendor: "xiaomi"
    firmware_min: "1.0.0"
    firmware_max: "3.5.9"
    vectors:
      - type: "uart"
        description: "UART header on mainboard, requires soldering"
        difficulty: "hard"
        requirements: ["physical_access", "uart_adapter"]
      - type: "su_binary"
        description: "Pre-rooted firmware available for downgrade"
        difficulty: "medium"
        requirements: ["ota_downgrade"]
    notes: "First gen, well documented. UART pins exposed."

