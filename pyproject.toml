[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xvt"
version = "0.1.0"
description = "Xiaomi Vacuum/Vale Tudo — Root access toolchain for Xiaomi robot vacuums"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "cryptography>=42.0",
    "pyyaml>=6.0",
    "zeroconf>=0.135",
    "scapy>=2.5",
    "python-miio>=0.5.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "mypy>=1.10",
]
build = [
    "pyinstaller>=6.10",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["xvt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/xvt --cov-report=xml --cov-report=term"
pythonpath = ["src"]

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "T20"]
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
namespace_packages = true

[tool.coverage.run]
source = ["src/xvt"]
branch = true

[tool.coverage.report]
fail_under = 78
precision = 2